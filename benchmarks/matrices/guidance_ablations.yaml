# Ablation registry for the "Benchmarks by Problem Set" pages (docs/benchmark-guidance/).
#
# Each ablation answers one customer question by changing ONE setting and leaving the rest
# as the dataset's configuration preset sets it (docs/benchmark-guidance/index.md, "How we run a benchmark").
# benchmarks/harness/render_guidance.py renders every ablation into its page between the
# `<!-- BEGIN GENERATED ABLATIONS -->` / `<!-- END GENERATED ABLATIONS -->` markers. When
# a results file exists at benchmarks/results/guidance/<ID>.json, the renderer fills the
# table from it; otherwise every cell is "—" and the answer is "Not yet measured".
#
# Fields:
#   id        stable ID used by the run scripts and the results file name
#   page      page slug under docs/benchmark-guidance/
#   question  the customer question, as a customer asks it
#   changes   the one setting that varies
#   values    its values; the default value is marked "(default)"
#   holds     settings that differ from the preset for every value
#   datasets  keys of `datasets` below
#   runs      runs per document per value
#   metrics   keys of `metrics` below, in column order
#   derives   for ablations computed from another ablation's runs, that ablation's ID
#   plot      the metric to plot (default: the first metric that applies)
#
# A dataset's `preset` names the config_library/unified preset its runs start from.

datasets:
  synth_100: {name: "Synthetic statement, 100 rows (3 pages)", short: "Statement, 100 rows", kind: list, link: "../idp-fundamentals/benchmark-datasets.md#synthetic-bank-statements", preset: bank-statement-sample}
  synth_400: {name: "Synthetic statement, 400 rows (9 pages)", short: "Statement, 400 rows", kind: list, link: "../idp-fundamentals/benchmark-datasets.md#synthetic-bank-statements", preset: bank-statement-sample}
  synth_800: {name: "Synthetic statement, 800 rows (17 pages)", short: "Statement, 800 rows", kind: list, link: "../idp-fundamentals/benchmark-datasets.md#synthetic-bank-statements", preset: bank-statement-sample}
  synth_1600: {name: "Synthetic statement, 1,600 rows (33 pages)", short: "Statement, 1,600 rows", kind: list, link: "../idp-fundamentals/benchmark-datasets.md#synthetic-bank-statements", preset: bank-statement-sample}
  synth_3200: {name: "Synthetic statement, 3,200 rows (66 pages)", short: "Statement, 3,200 rows", kind: list, link: "../idp-fundamentals/benchmark-datasets.md#synthetic-bank-statements", preset: bank-statement-sample}
  synth_two_docs: {name: "Synthetic file holding two statements", short: "Two statements in one file", kind: packet, link: "../idp-fundamentals/benchmark-datasets.md#synthetic-bank-statements", preset: bank-statement-sample}
  realkie: {name: "RealKIE-FCC-Verified (20 invoices)", short: "RealKIE", kind: fields, link: "../idp-fundamentals/benchmark-datasets.md#realkie-fcc-verified", preset: realkie-fcc-verified}
  confbench: {name: "ConfBench (RealKIE invoices with scan noise)", short: "ConfBench", kind: fields, link: "../extensions/confbench-testset.md", preset: realkie-fcc-verified}
  omniai: {name: "OmniAI-OCR-Benchmark, all 9 formats", short: "OmniAI", kind: fields, link: "../idp-fundamentals/benchmark-datasets.md#omniai-ocr-benchmark", preset: ocr-benchmark}
  fake_w2: {name: "Fake-W2-Tax-Forms (W-2 forms, 45 fields)", short: "Fake-W2", kind: fields, link: "../idp-fundamentals/benchmark-datasets.md#fake-w2-tax-forms", preset: fake-w2}
  docsplit: {name: "DocSplit-Poly-Seq (20 packets)", short: "DocSplit", kind: packet, link: "../idp-fundamentals/benchmark-datasets.md#docsplit-poly-seq", preset: docsplit}
  long_packets: {name: "Long packets, 30-60 pages (to be built)", short: "Long packets", kind: packet, new: true}
  same_class_packets: {name: "Same-class documents back to back (to be built)", short: "Same-class packets", kind: packet, new: true}
  packets_with_fields: {name: "Packets with section and field ground truth (to be built)", short: "Packets with fields", kind: packet_fields, new: true}
  handwritten: {name: "Handwritten forms (to be built)", short: "Handwritten forms", kind: fields, new: true}
  rule_verdicts: {name: "Documents with expert rule verdicts (to be built)", short: "Rule-verdict set", kind: rules, new: true}

# `kinds` lists the dataset kinds a metric applies to. The renderer draws one results table
# per dataset kind, with only the metrics that apply to it.
metrics:
  completeness: {name: "Completeness", kinds: [list]}
  cell_accuracy: {name: "Cell accuracy", kinds: [list]}
  weighted_accuracy: {name: "Weighted accuracy", kinds: [fields, packet_fields]}
  all_fields_right: {name: "Documents with every field right", kinds: [fields]}
  page_accuracy: {name: "Page accuracy", kinds: [packet, packet_fields]}
  boundary_accuracy: {name: "Boundary accuracy", kinds: [packet, packet_fields]}
  label_accuracy: {name: "Label accuracy", kinds: [packet, packet_fields]}
  over_splits: {name: "Over-splits", kinds: [packet, packet_fields]}
  merges: {name: "Merges", kinds: [packet, packet_fields]}
  auroc: {name: "AUROC", kinds: [list, fields, packet]}
  calibration_error: {name: "Calibration error", kinds: [list, fields, packet]}
  alert_rate: {name: "Values below threshold", kinds: [list, fields, packet]}
  errors_caught: {name: "Errors below threshold", kinds: [list, fields, packet]}
  verdict_agreement: {name: "Verdict agreement", kinds: [rules]}
  wrong_passes: {name: "Wrong passes", kinds: [rules]}
  wrong_fails: {name: "Wrong fails", kinds: [rules]}
  not_decided: {name: "Information not found", kinds: [rules]}
  ocr_tokens: {name: "OCR tokens per page", kinds: [list, fields, packet, packet_fields]}
  classification_tokens: {name: "Classification tokens per page", kinds: [list, fields, packet, packet_fields]}
  extraction_tokens: {name: "Extraction tokens per page", kinds: [list, fields, packet_fields]}
  scoring_tokens: {name: "Scoring tokens per page", kinds: [list, fields, packet_fields]}
  rule_tokens: {name: "Rule validation tokens per document", kinds: [rules]}
  total_tokens: {name: "Total tokens per page", kinds: [list, fields, packet, packet_fields, rules]}
  cached_share: {name: "Share of input served from cache", kinds: [list, fields, packet, packet_fields, rules]}
  median_seconds: {name: "Median seconds per document", kinds: [list, fields, packet, packet_fields, rules]}

ablations:
  # ------------------------------------------------------------- every problem set
  - id: TR-01
    page: index
    question: "How much do results vary between identical runs?"
    changes: "Nothing: the preset, run 10 times"
    values: ["Preset"]
    datasets: [realkie, docsplit, synth_400]
    runs: 10
    metrics: [weighted_accuracy, boundary_accuracy, completeness, total_tokens]
  - id: TR-02
    page: index
    question: "How long does a document take, and how many documents an hour?"
    changes: "Documents submitted at once"
    values: ["1", "10", "50"]
    datasets: [realkie, synth_400]
    runs: 3
    metrics: [median_seconds]

  # ---------------------------------------------------------------- digitization
  - id: DG-01
    page: digitization
    question: "Does the OCR reader make a difference to extraction accuracy?"
    changes: "OCR reader"
    values: ["Textract, tables and layout (default)", "Textract, layout only", "Bedrock vision model (Nova 2 Lite)"]
    datasets: [realkie, confbench, omniai, synth_400]
    runs: 3
    metrics: [weighted_accuracy, completeness, cell_accuracy, ocr_tokens, total_tokens]
  - id: DG-02
    page: digitization
    question: "If I read pages with a vision model, which model?"
    changes: "Model used for Bedrock vision OCR"
    values: ["Amazon Nova 2 Lite", "Claude Haiku 5.5", "Claude Sonnet 5"]
    holds: "OCR reader set to the Bedrock vision model"
    datasets: [realkie, confbench, synth_400]
    runs: 3
    metrics: [weighted_accuracy, cell_accuracy, ocr_tokens, total_tokens]
  - id: DG-03
    page: digitization
    question: "Does a specialized OCR model beat Textract?"
    changes: "OCR reader"
    values: ["Textract, tables and layout (default)", "Chandra (Lambda hook)", "Mistral OCR (Lambda hook)", "Cohere Parse (Lambda hook)"]
    datasets: [realkie, confbench, omniai]
    runs: 3
    metrics: [weighted_accuracy, all_fields_right, total_tokens]
  - id: DG-04
    page: digitization
    question: "What resolution should pages be rendered at?"
    changes: "`ocr.image.dpi`"
    values: ["300 (default)", "200", "150"]
    datasets: [realkie, confbench, synth_400]
    runs: 3
    metrics: [weighted_accuracy, cell_accuracy, total_tokens]
  - id: DG-05
    page: digitization
    question: "Does image preprocessing help on poor scans?"
    changes: "`ocr.image.preprocessing`"
    values: ["Off (default)", "On"]
    datasets: [confbench, realkie]
    runs: 3
    metrics: [weighted_accuracy, all_fields_right, total_tokens]
  - id: DG-06
    page: digitization
    question: "Which Textract features do I need?"
    changes: "`ocr.features`"
    values: ["TABLES, LAYOUT, SIGNATURES (default)", "LAYOUT only", "TABLES only", "TABLES, LAYOUT, SIGNATURES, FORMS"]
    datasets: [realkie, fake_w2, synth_400]
    runs: 3
    metrics: [weighted_accuracy, completeness, cell_accuracy, total_tokens]
  - id: DG-07
    page: digitization
    question: "How much accuracy does scan quality cost?"
    changes: "Scan quality"
    values: ["Clean original", "Light noise", "Moderate noise", "Heavy noise"]
    datasets: [confbench]
    runs: 3
    metrics: [weighted_accuracy, all_fields_right, auroc]
  - id: DG-08
    page: digitization
    question: "Which reader handles handwriting best?"
    changes: "OCR reader"
    values: ["Textract, tables and layout (default)", "Bedrock vision model (Claude Sonnet 5)", "Chandra (Lambda hook)"]
    datasets: [handwritten]
    runs: 3
    metrics: [weighted_accuracy, all_fields_right, total_tokens]

  # ------------------------------------------------- splitting and classification
  - id: SC-01
    page: splitting-and-classification
    question: "Help me choose a mechanism for packet splitting."
    changes: "Granularity and strategy"
    values: ["Page by page, one call (default)", "Holistic, one call", "Detect sections first (page by page), then classify", "Detect sections first (holistic), then classify"]
    datasets: [docsplit, synth_two_docs, same_class_packets]
    runs: 3
    metrics: [page_accuracy, boundary_accuracy, label_accuracy, over_splits, merges, classification_tokens]
  - id: SC-02
    page: splitting-and-classification
    question: "Do I need page images in the classification prompt?"
    changes: "What the classification model reads"
    values: ["Text and images (default)", "Text only", "Images only"]
    holds: "Run at both granularities: page by page and holistic"
    datasets: [docsplit]
    runs: 3
    metrics: [page_accuracy, boundary_accuracy, label_accuracy, classification_tokens]
  - id: SC-03
    page: splitting-and-classification
    question: "Which classification model should I use?"
    changes: "Classification model"
    values: ["Amazon Nova 2 Lite (default)", "Amazon Nova Pro", "Claude Haiku 5.5", "Claude Sonnet 5"]
    holds: "Run at both granularities: page by page and holistic"
    datasets: [docsplit]
    runs: 3
    metrics: [page_accuracy, boundary_accuracy, label_accuracy, classification_tokens, median_seconds]
  - id: SC-04
    page: splitting-and-classification
    question: "How long a packet can holistic classification handle?"
    changes: "Pages per holistic call (`window_pages`)"
    values: ["20 (default)", "10", "40"]
    holds: "Holistic, one call"
    datasets: [long_packets, docsplit]
    runs: 3
    metrics: [page_accuracy, boundary_accuracy, label_accuracy, classification_tokens]
  - id: SC-05
    page: splitting-and-classification
    question: "Does neighboring-page context help page-by-page classification?"
    changes: "`contextPagesCount`"
    values: ["0 (default)", "1", "2"]
    datasets: [docsplit, same_class_packets]
    runs: 3
    metrics: [boundary_accuracy, label_accuracy, over_splits, merges, classification_tokens]
  - id: SC-06
    page: splitting-and-classification
    question: "Do few-shot examples help classification?"
    changes: "Few-shot examples"
    values: ["None (default)", "One example per class", "Two examples per class"]
    datasets: [docsplit]
    runs: 3
    metrics: [page_accuracy, label_accuracy, classification_tokens]
  - id: SC-07
    page: splitting-and-classification
    question: "How much do class descriptions matter?"
    changes: "Class descriptions"
    values: ["Class names only", "Generic descriptions", "Descriptions that name distinguishing features"]
    datasets: [docsplit]
    runs: 3
    metrics: [page_accuracy, label_accuracy]
  - id: SC-08
    page: splitting-and-classification
    question: "Does accuracy drop as I add document classes?"
    changes: "Number of document classes in the configuration"
    values: ["5", "13", "30 (13 plus 17 distractor classes)"]
    datasets: [docsplit]
    runs: 3
    metrics: [page_accuracy, label_accuracy, classification_tokens]
  - id: SC-09
    page: splitting-and-classification
    question: "How small can classification images be?"
    changes: "Classification image size (long edge)"
    values: ["As rendered (default)", "1,024 pixels", "512 pixels"]
    datasets: [docsplit]
    runs: 3
    metrics: [page_accuracy, boundary_accuracy, classification_tokens]
  - id: SC-10
    page: splitting-and-classification
    question: "If every file is one document, should I turn splitting off?"
    changes: "Section splitting"
    values: ["Model decides (default)", "One section"]
    datasets: [realkie, synth_400, synth_800]
    runs: 3
    metrics: [weighted_accuracy, completeness, classification_tokens]

  # ------------------------------------------------------------------- extraction
  - id: EX-01
    page: extraction
    question: "When is agentic (iterative) extraction worth it?"
    changes: "Extraction mode"
    values: ["Single pass, Simple (default)", "Iterative, Advanced"]
    datasets: [synth_100, synth_400, synth_800, synth_1600, synth_3200, realkie, fake_w2]
    runs: 3
    metrics: [completeness, cell_accuracy, weighted_accuracy, extraction_tokens, median_seconds]
  - id: EX-02
    page: extraction
    question: "Which extraction model should I use?"
    changes: "Extraction model"
    values: ["Claude Sonnet 5 (default)", "Amazon Nova Lite", "Amazon Nova Pro", "Amazon Nova 2 Lite", "Claude Haiku 5.5", "Claude Sonnet 4.6", "Claude Sonnet 5.5", "Claude Opus 5", "Claude Opus 5.5", "OpenAI GPT-6 Astra", "xAI Grok 4.6"]
    datasets: [realkie, fake_w2, synth_400]
    runs: 3
    metrics: [weighted_accuracy, completeness, cell_accuracy, extraction_tokens, median_seconds]
  - id: EX-03
    page: extraction
    question: "Does more reasoning effort improve extraction?"
    changes: "`extraction.reasoning_effort`"
    values: ["Low (default)", "Medium", "High"]
    datasets: [realkie, fake_w2, synth_400]
    runs: 3
    metrics: [weighted_accuracy, completeness, extraction_tokens, median_seconds]
  - id: EX-04
    page: extraction
    question: "How much do field descriptions matter?"
    changes: "Field descriptions"
    values: ["Field names only", "Short descriptions", "Descriptions with location, exclusions and format"]
    datasets: [realkie, fake_w2]
    runs: 3
    metrics: [weighted_accuracy, all_fields_right, extraction_tokens]
  - id: EX-05
    page: extraction
    question: "Do few-shot examples help extraction?"
    changes: "Few-shot examples"
    values: ["None (default)", "One example per class", "Three examples per class"]
    datasets: [realkie, fake_w2]
    runs: 3
    metrics: [weighted_accuracy, all_fields_right, extraction_tokens]
  - id: EX-06
    page: extraction
    question: "Does sending page images to the extraction model help?"
    changes: "Page images in the extraction prompt"
    values: ["Text and images (default)", "Text only"]
    datasets: [realkie, fake_w2, confbench]
    runs: 3
    metrics: [weighted_accuracy, all_fields_right, extraction_tokens]
  - id: EX-07
    page: extraction
    question: "Does deterministic table parsing help iterative extraction?"
    changes: "`extraction.agentic.table_parsing.enabled`"
    values: ["On (default)", "Off"]
    holds: "Iterative (Advanced) extraction"
    datasets: [synth_400, synth_800, synth_3200]
    runs: 3
    metrics: [completeness, cell_accuracy, extraction_tokens, median_seconds]
  - id: EX-08
    page: extraction
    question: "What shard size should iterative extraction use?"
    changes: "Pages per shard (`max_pages_per_shard`)"
    values: ["5 (default)", "3", "10", "25"]
    holds: "Iterative (Advanced) extraction"
    datasets: [synth_800, synth_3200]
    runs: 3
    metrics: [completeness, cell_accuracy, extraction_tokens, median_seconds]
  - id: EX-09
    page: extraction
    question: "Should iterative extraction load page images only when it needs them?"
    changes: "`extraction.agentic.table_parsing.lazy_images`"
    values: ["On (default)", "Off"]
    holds: "Iterative (Advanced) extraction"
    datasets: [synth_400, synth_800, realkie]
    runs: 3
    metrics: [completeness, cell_accuracy, weighted_accuracy, extraction_tokens]
  - id: EX-10
    page: extraction
    question: "Do schema validation and value coercion improve the output?"
    changes: "`extraction.validation` and `extraction.coercion`"
    values: ["Both on (default)", "Coercion off", "Validation off"]
    datasets: [fake_w2, realkie]
    runs: 3
    metrics: [weighted_accuracy, all_fields_right, extraction_tokens]
  - id: EX-11
    page: extraction
    question: "Should I retry failed fields with a stronger model?"
    changes: "`extraction.validation.fail_action`"
    values: ["warn (default)", "escalate", "reject"]
    datasets: [fake_w2, realkie]
    runs: 3
    metrics: [weighted_accuracy, all_fields_right, extraction_tokens]
  - id: EX-12
    page: extraction
    question: "Does forced tool use make single-pass output more reliable?"
    changes: "`extraction.forced_tool.enabled`"
    values: ["Off (default)", "On"]
    datasets: [realkie, synth_400]
    runs: 3
    metrics: [weighted_accuracy, completeness, extraction_tokens]
  - id: EX-13
    page: extraction
    question: "How should I extract sections that hold several records?"
    changes: "Multi-instance sections"
    values: ["Off (default)", "On"]
    datasets: [synth_two_docs, fake_w2]
    runs: 3
    metrics: [completeness, weighted_accuracy, extraction_tokens]
  - id: EX-14
    page: extraction
    question: "How accurate is extraction across many document formats?"
    changes: "Document format"
    values: ["Each of the 9 OmniAI formats"]
    datasets: [omniai]
    runs: 3
    metrics: [weighted_accuracy, all_fields_right, extraction_tokens]
  - id: EX-15
    page: extraction
    question: "How much do splitting errors cost extraction in a packet?"
    changes: "Granularity and strategy"
    values: ["Page by page, one call (default)", "Holistic, one call", "Detect sections first, then classify"]
    datasets: [packets_with_fields]
    runs: 3
    metrics: [boundary_accuracy, weighted_accuracy, total_tokens]

  # -------------------------------------------------------- confidence assessment
  - id: CF-01
    page: confidence-assessment
    question: "Can I route human review by confidence?"
    changes: "Scoring model"
    values: ["Amazon Nova Lite (default)", "Claude Sonnet 5"]
    datasets: [confbench, realkie, synth_400]
    runs: 3
    metrics: [auroc, calibration_error, alert_rate, errors_caught]
  - id: CF-02
    page: confidence-assessment
    question: "Which scoring model should I use?"
    changes: "Scoring model"
    values: ["Amazon Nova Lite (default)", "Amazon Nova 2 Lite", "Claude Haiku 5.5", "Claude Sonnet 5"]
    datasets: [confbench, realkie]
    runs: 3
    metrics: [auroc, calibration_error, alert_rate, errors_caught, scoring_tokens]
  - id: CF-03
    page: confidence-assessment
    question: "Separate scoring pass or integrated into extraction?"
    changes: "Confidence mode"
    values: ["Separate (default)", "Integrated", "Off"]
    holds: "Run in both extraction modes"
    datasets: [confbench, realkie, synth_800]
    runs: 3
    metrics: [weighted_accuracy, completeness, auroc, scoring_tokens, median_seconds]
  - id: CF-04
    page: confidence-assessment
    question: "What confidence threshold should I set?"
    changes: "Confidence threshold"
    values: ["0.5", "0.7", "0.8 (default)", "0.9", "0.95"]
    holds: "Computed from the CF-02 runs, per scoring model"
    datasets: [confbench, realkie]
    runs: 0
    derives: CF-02
    metrics: [alert_rate, errors_caught]
  - id: CF-05
    page: confidence-assessment
    question: "Does classification confidence flag the wrong document class?"
    changes: "Classification model"
    values: ["Amazon Nova 2 Lite (default)", "Claude Haiku 5.5", "Claude Sonnet 5"]
    datasets: [docsplit]
    runs: 3
    metrics: [label_accuracy, auroc, alert_rate, errors_caught, classification_tokens]
  - id: CF-06
    page: confidence-assessment
    question: "Does the scoring model need page images?"
    changes: "Page images in the scoring prompt"
    values: ["Text and images (default)", "Text only"]
    datasets: [confbench, fake_w2]
    runs: 3
    metrics: [auroc, calibration_error, scoring_tokens]
  - id: CF-07
    page: confidence-assessment
    question: "How should long lists be scored?"
    changes: "`extraction.confidence.list_batch_size`"
    values: ["25 (default)", "12", "50"]
    datasets: [synth_400, synth_800, synth_1600]
    runs: 3
    metrics: [completeness, auroc, scoring_tokens, median_seconds]

  # -------------------------------------------------------------- rule validation
  - id: RV-01
    page: rule-validation
    question: "How accurate are rule verdicts?"
    changes: "Rule validation model"
    values: ["Default model", "Claude Haiku 5.5", "Claude Sonnet 5"]
    datasets: [rule_verdicts]
    runs: 3
    metrics: [verdict_agreement, wrong_passes, wrong_fails, not_decided, rule_tokens]
  - id: RV-02
    page: rule-validation
    question: "Language model or Z3 for exact rules?"
    changes: "Rule engine (`x-aws-idp-validation-engine`)"
    values: ["Language model (default)", "Z3 solver"]
    datasets: [rule_verdicts]
    runs: 3
    metrics: [verdict_agreement, wrong_passes, wrong_fails, rule_tokens]
  - id: RV-03
    page: rule-validation
    question: "Are rules drafted by Policy Discovery as good as hand-written rules?"
    changes: "Rule source"
    values: ["Hand-written", "Drafted by Policy Discovery", "Drafted, then reviewed by hand"]
    datasets: [rule_verdicts]
    runs: 3
    metrics: [verdict_agreement, wrong_passes, wrong_fails]
  - id: RV-04
    page: rule-validation
    question: "How large should rule-validation chunks be?"
    changes: "`max_chunk_size`"
    values: ["8,000 (default)", "4,000", "16,000"]
    datasets: [rule_verdicts]
    runs: 3
    metrics: [verdict_agreement, not_decided, rule_tokens]

  # ------------------------------------------------------------- token use, cost
  - id: TU-01
    page: token-use
    question: "Where do the tokens go?"
    changes: "Nothing: the preset, measured step by step"
    values: ["Preset"]
    datasets: [realkie, docsplit, synth_400]
    runs: 3
    metrics: [ocr_tokens, classification_tokens, extraction_tokens, scoring_tokens, total_tokens, cached_share]
  - id: TU-02
    page: token-use
    question: "How much does prompt caching save in extraction?"
    changes: "`extraction.prompt_cache`"
    values: ["auto (default)", "off"]
    datasets: [realkie, docsplit, synth_400]
    runs: 3
    metrics: [total_tokens, cached_share, median_seconds]
  - id: TU-03
    page: token-use
    question: "What do page images cost in tokens, step by step?"
    changes: "Page images"
    values: ["In every step (default)", "Off in classification", "Off in extraction", "Off in scoring"]
    datasets: [realkie, docsplit]
    runs: 3
    metrics: [classification_tokens, extraction_tokens, scoring_tokens, total_tokens]
  - id: TU-04
    page: token-use
    question: "What is the cheapest configuration that keeps accuracy?"
    changes: "Configuration"
    values: ["Preset", "Holistic classification, text only", "Textract layout only", "Confidence off", "All three together"]
    datasets: [realkie, docsplit, synth_400]
    runs: 3
    metrics: [weighted_accuracy, boundary_accuracy, completeness, total_tokens]
  - id: TU-05
    page: token-use
    question: "How many tokens does each extraction model use for the same document?"
    changes: "Extraction model"
    values: ["The models in EX-02"]
    holds: "Computed from the EX-02 runs"
    datasets: [realkie, synth_400]
    runs: 0
    derives: EX-02
    metrics: [extraction_tokens, total_tokens]
