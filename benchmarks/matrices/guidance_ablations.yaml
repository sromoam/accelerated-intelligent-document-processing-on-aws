# Ablation registry for the "Benchmarks by Problem Set" pages (docs/benchmark-guidance/).
#
# Each ablation answers one customer question by changing ONE setting and leaving the rest
# as the dataset's configuration preset sets it (docs/benchmark-guidance/index.md, "How we run a benchmark").
# benchmarks/harness/render_guidance.py renders every ablation into its page between the
# `<!-- BEGIN GENERATED ABLATIONS -->` / `<!-- END GENERATED ABLATIONS -->` markers. When
# a results file exists at benchmarks/results/guidance/<ID>.json, the renderer fills the
# table from it; otherwise every cell is "—" and the answer is "Not yet measured".
#
# Fields:
#   id        stable ID used by the run scripts and the results file name
#   page      page slug under docs/benchmark-guidance/
#   question  the customer question, as a customer asks it
#   changes   the one setting that varies
#   values    its values; the default value is marked "(default)"
#   holds     settings that differ from the preset for every value
#   datasets  keys of `datasets` below
#   runs      runs per document per value
#   metrics   keys of `metrics` below, in column order
#   derives   for ablations computed from another ablation's runs, that ablation's ID
#   plot      the metric to plot (default: the first metric that applies)
#   plot_x    the tokens metric for the x-axis when cost is not available (default:
#             total tokens when measured). Cost per 1,000 documents is used whenever
#             every plotted value has usage in its results file.
#   grid      optional {rows, cols}: values are named "<row> · <col>" and render as a grid
#   set       per value, the configuration overrides that produce it (dotted paths),
#             in the order of `values`; run_guidance_ablation.py applies them
#
# A dataset's `testset` is its Test Studio test set ID and `docs` the number of its
# documents a run uses. `max_failed` is how many failed documents a run may have and
# still count (default 0): one DocSplit packet trips a Bedrock content filter during
# extraction, after classification has finished, and fails the document.
#
# A dataset's `preset` names the config_library/unified preset its runs start from.

datasets:
  synth_100: {name: "Synthetic statement, 100 rows (3 pages)", short: "Statement, 100 rows", kind: list, link: "../idp-fundamentals/benchmark-datasets.md#synthetic-bank-statements", preset: bank-statement-sample}
  synth_400: {name: "Synthetic statement, 400 rows (9 pages)", short: "Statement, 400 rows", kind: list, link: "../idp-fundamentals/benchmark-datasets.md#synthetic-bank-statements", preset: bank-statement-sample}
  synth_800: {name: "Synthetic statement, 800 rows (17 pages)", short: "Statement, 800 rows", kind: list, link: "../idp-fundamentals/benchmark-datasets.md#synthetic-bank-statements", preset: bank-statement-sample}
  synth_1600: {name: "Synthetic statement, 1,600 rows (33 pages)", short: "Statement, 1,600 rows", kind: list, link: "../idp-fundamentals/benchmark-datasets.md#synthetic-bank-statements", preset: bank-statement-sample}
  synth_3200: {name: "Synthetic statement, 3,200 rows (66 pages)", short: "Statement, 3,200 rows", kind: list, link: "../idp-fundamentals/benchmark-datasets.md#synthetic-bank-statements", preset: bank-statement-sample}
  synth_two_docs: {name: "Synthetic file holding two statements", short: "Two statements in one file", kind: packet, link: "../idp-fundamentals/benchmark-datasets.md#synthetic-bank-statements", preset: bank-statement-sample}
  realkie: {name: "RealKIE-FCC-Verified (20 invoices)", short: "RealKIE", kind: fields, link: "../idp-fundamentals/benchmark-datasets.md#realkie-fcc-verified", preset: realkie-fcc-verified, testset: realkie-fcc-verified, docs: 20}
  realkie_long: {name: "RealKIE-FCC-Verified, long invoices (19 invoices, 8 to 33 pages)", short: "RealKIE, long", kind: fields, link: "../idp-fundamentals/benchmark-datasets.md#realkie-fcc-verified", preset: realkie-fcc-verified, testset: realkie-fcc-long, docs: 19}
  realkie_short: {name: "RealKIE-FCC-Verified, short invoices (24 invoices, 1 or 2 pages)", short: "RealKIE, short", kind: fields, link: "../idp-fundamentals/benchmark-datasets.md#realkie-fcc-verified", preset: realkie-fcc-verified, testset: realkie-fcc-short, docs: 24}
  confbench: {name: "ConfBench (RealKIE invoices with scan noise)", short: "ConfBench", kind: fields, link: "../extensions/confbench-testset.md", preset: realkie-fcc-verified}
  omniai: {name: "OmniAI-OCR-Benchmark, bank checks (20)", short: "OmniAI, bank checks", kind: fields, link: "../idp-fundamentals/benchmark-datasets.md#omniai-ocr-benchmark", preset: ocr-benchmark, testset: ocr-benchmark, docs: 20}
  omniai_all: {name: "OmniAI-OCR-Benchmark, all 9 formats (293 documents)", short: "OmniAI", kind: fields, link: "../idp-fundamentals/benchmark-datasets.md#omniai-ocr-benchmark", preset: ocr-benchmark, testset: ocr-benchmark, docs: 293}
  fake_w2: {name: "Fake-W2-Tax-Forms (W-2 forms, 45 fields)", short: "Fake-W2", kind: fields, link: "../idp-fundamentals/benchmark-datasets.md#fake-w2-tax-forms", preset: fake-w2, testset: fake-w2, docs: 20}
  docsplit: {name: "DocSplit-Poly-Seq (20 packets)", short: "DocSplit", kind: packet, link: "../idp-fundamentals/benchmark-datasets.md#docsplit-poly-seq", preset: docsplit, testset: docsplit, docs: 20, max_failed: 1}
  long_packets: {name: "Long packets, 30-60 pages (to be built)", short: "Long packets", kind: packet, new: true}
  same_class_packets: {name: "Same-class documents back to back (to be built)", short: "Same-class packets", kind: packet, new: true}
  packets_with_fields: {name: "Packets with section and field ground truth (to be built)", short: "Packets with fields", kind: packet_fields, new: true}
  handwritten: {name: "Handwritten forms (to be built)", short: "Handwritten forms", kind: fields, new: true}
  rule_verdicts: {name: "Documents with expert rule verdicts (to be built)", short: "Rule-verdict set", kind: rules, new: true}

# `kinds` lists the dataset kinds a metric applies to. The renderer draws one results table
# per dataset kind, with only the metrics that apply to it. `cost_per_1000_docs` is not
# listed in any ablation: the renderer prices the results file's usage with
# config_library/pricing.yaml and adds the column whenever usage is there.
metrics:
  completeness: {name: "Completeness", kinds: [list]}
  cell_accuracy: {name: "Cell accuracy", kinds: [list]}
  weighted_accuracy: {name: "Weighted accuracy", kinds: [fields, packet_fields]}
  all_fields_right: {name: "Documents with every field right", kinds: [fields]}
  page_accuracy: {name: "Page accuracy", kinds: [packet, packet_fields]}
  boundary_accuracy: {name: "Boundary accuracy", kinds: [packet, packet_fields]}
  label_accuracy: {name: "Label accuracy", kinds: [packet, packet_fields]}
  section_accuracy: {name: "Section accuracy", kinds: [packet, packet_fields]}
  grouping_score: {name: "Grouping score", kinds: [packet, packet_fields]}
  over_splits: {name: "Over-splits", kinds: [packet, packet_fields]}
  merges: {name: "Merges", kinds: [packet, packet_fields]}
  auroc: {name: "AUROC", kinds: [list, fields, packet]}
  calibration_error: {name: "Calibration error", kinds: [list, fields, packet]}
  alert_rate: {name: "Values below threshold", kinds: [list, fields, packet]}
  errors_caught: {name: "Errors below threshold", kinds: [list, fields, packet]}
  verdict_agreement: {name: "Verdict agreement", kinds: [rules]}
  wrong_passes: {name: "Wrong passes", kinds: [rules]}
  wrong_fails: {name: "Wrong fails", kinds: [rules]}
  not_decided: {name: "Information not found", kinds: [rules]}
  ocr_tokens: {name: "OCR tokens per page", kinds: [list, fields, packet, packet_fields]}
  classification_tokens: {name: "Classification tokens per page", kinds: [list, fields, packet, packet_fields]}
  extraction_tokens: {name: "Extraction tokens per page", kinds: [list, fields, packet_fields]}
  scoring_tokens: {name: "Scoring tokens per page", kinds: [list, fields, packet_fields]}
  rule_tokens: {name: "Rule validation tokens per document", kinds: [rules]}
  total_tokens: {name: "Total tokens per page", kinds: [list, fields, packet, packet_fields, rules]}
  cost_per_1000_docs: {name: "Cost per 1,000 documents (USD)", kinds: [list, fields, packet, packet_fields, rules]}
  cached_share: {name: "Share of input served from cache", kinds: [list, fields, packet, packet_fields, rules]}
  median_seconds: {name: "Median seconds per document", kinds: [list, fields, packet, packet_fields, rules]}

ablations:
  # ------------------------------------------------------------- every problem set
  - id: TR-01
    page: index
    question: "How much do results vary between identical runs?"
    changes: "Nothing: the preset, run 10 times"
    values: ["Preset"]
    datasets: [realkie, docsplit, synth_400]
    runs: 10
    metrics: [weighted_accuracy, boundary_accuracy, completeness, total_tokens]
  - id: TR-02
    page: index
    question: "How long does a document take, and how many documents an hour?"
    changes: "Documents submitted at once"
    values: ["1", "10", "50"]
    datasets: [realkie, synth_400]
    runs: 3
    metrics: [median_seconds]

  # ---------------------------------------------------------------- digitization
  - id: DG-01
    page: digitization
    question: "Does the OCR reader make a difference to extraction accuracy?"
    changes: "OCR reader"
    values: ["Textract, tables and layout (default)", "Textract, layout only", "Bedrock vision model (Nova 2 Lite)"]
    set: [{"ocr.backend": "textract", "ocr.features": [{"name": "TABLES"}, {"name": "LAYOUT"}, {"name": "SIGNATURES"}]}, {"ocr.backend": "textract", "ocr.features": [{"name": "LAYOUT"}]}, {"ocr.backend": "bedrock", "ocr.model_id": "us.amazon.nova-2-lite-v1:0", "ocr.task_prompt": "Extract all text from this document image. Preserve the layout, including paragraphs, tables, and formatting.\n<document-image>\n{DOCUMENT_IMAGE}\n</document-image>"}]
    datasets: [realkie, confbench, omniai, synth_400]
    runs: 3
    metrics: [weighted_accuracy, completeness, cell_accuracy, ocr_tokens, total_tokens]
  - id: DG-02
    page: digitization
    question: "If I read pages with a vision model, which model?"
    changes: "Model used for Bedrock vision OCR"
    values: ["Amazon Nova 2 Lite", "Claude Haiku 5.5", "Claude Sonnet 5"]
    holds: "OCR reader set to the Bedrock vision model"
    datasets: [realkie, confbench, synth_400]
    runs: 3
    metrics: [weighted_accuracy, cell_accuracy, ocr_tokens, total_tokens]
  - id: DG-03
    page: digitization
    question: "Does a specialized OCR model beat Textract?"
    changes: "OCR reader"
    values: ["Textract, tables and layout (default)", "Chandra (Lambda hook)", "Mistral OCR (Lambda hook)", "Cohere Parse (Lambda hook)"]
    datasets: [realkie, confbench, omniai]
    runs: 3
    metrics: [weighted_accuracy, all_fields_right, total_tokens]
  - id: DG-04
    page: digitization
    question: "What resolution should pages be rendered at?"
    changes: "`ocr.image.dpi`"
    values: ["300 (default)", "200", "150"]
    set: [{"ocr.image.dpi": 300}, {"ocr.image.dpi": 200}, {"ocr.image.dpi": 150}]
    datasets: [realkie, confbench, synth_400]
    runs: 3
    metrics: [weighted_accuracy, cell_accuracy, total_tokens]
  - id: DG-05
    page: digitization
    question: "Does image preprocessing help on poor scans?"
    changes: "`ocr.image.preprocessing`"
    values: ["Off (default)", "On"]
    datasets: [confbench, realkie]
    runs: 3
    metrics: [weighted_accuracy, all_fields_right, total_tokens]
  - id: DG-06
    page: digitization
    question: "Which Textract features do I need?"
    changes: "`ocr.features`"
    values: ["TABLES, LAYOUT, SIGNATURES (default)", "LAYOUT only", "TABLES only", "TABLES, LAYOUT, SIGNATURES, FORMS"]
    set: [{"ocr.features": [{"name": "TABLES"}, {"name": "LAYOUT"}, {"name": "SIGNATURES"}]}, {"ocr.features": [{"name": "LAYOUT"}]}, {"ocr.features": [{"name": "TABLES"}]}, {"ocr.features": [{"name": "TABLES"}, {"name": "LAYOUT"}, {"name": "SIGNATURES"}, {"name": "FORMS"}]}]
    datasets: [realkie, fake_w2, synth_400]
    runs: 3
    metrics: [weighted_accuracy, completeness, cell_accuracy, total_tokens]
  - id: DG-07
    page: digitization
    question: "How much accuracy does scan quality cost?"
    changes: "Scan quality"
    values: ["Clean original", "Light noise", "Moderate noise", "Heavy noise"]
    datasets: [confbench]
    runs: 3
    metrics: [weighted_accuracy, all_fields_right, auroc]
  - id: DG-08
    page: digitization
    question: "Which reader handles handwriting best?"
    changes: "OCR reader"
    values: ["Textract, tables and layout (default)", "Bedrock vision model (Claude Sonnet 5)", "Chandra (Lambda hook)"]
    datasets: [handwritten]
    runs: 3
    metrics: [weighted_accuracy, all_fields_right, total_tokens]

  # ------------------------------------------------- splitting and classification
  - id: SC-01
    page: splitting-and-classification
    question: "Does holistic classification beat page-by-page classification?"
    changes: "Granularity and strategy"
    values: ["Page by page, one call (default)", "Holistic, one call", "Detect sections first (page by page), then classify", "Detect sections first (holistic), then classify"]
    set: [{"classification.strategy": "combined", "classification.combined.granularity": "page"}, {"classification.strategy": "combined", "classification.combined.granularity": "packet"}, {"classification.strategy": "split_then_classify", "classification.split_then_classify.splitting.llm.granularity": "page"}, {"classification.strategy": "split_then_classify", "classification.split_then_classify.splitting.llm.granularity": "packet"}]
    datasets: [docsplit, synth_two_docs, same_class_packets]
    runs: 3
    metrics: [page_accuracy, section_accuracy, grouping_score, boundary_accuracy, label_accuracy, classification_tokens, total_tokens]
    plot: section_accuracy
  - id: SC-11
    page: splitting-and-classification
    question: "Which splitting mechanism works best with each classification model?"
    changes: "Granularity and strategy, by classification model"
    values: ["Page by page \u00b7 Amazon Nova 2 Lite (default)", "Holistic \u00b7 Amazon Nova 2 Lite (default)", "Detect sections first, page by page \u00b7 Amazon Nova 2 Lite (default)", "Detect sections first, holistic \u00b7 Amazon Nova 2 Lite (default)", "Page by page \u00b7 Claude Haiku 5.5", "Holistic \u00b7 Claude Haiku 5.5", "Detect sections first, page by page \u00b7 Claude Haiku 5.5", "Detect sections first, holistic \u00b7 Claude Haiku 5.5", "Page by page \u00b7 Claude Sonnet 5", "Holistic \u00b7 Claude Sonnet 5", "Detect sections first, page by page \u00b7 Claude Sonnet 5", "Detect sections first, holistic \u00b7 Claude Sonnet 5"]
    set: [{"classification.strategy": "combined", "classification.combined.granularity": "page", "classification.combined.llm.model": "us.amazon.nova-2-lite-v1:0", "classification.split_then_classify.splitting.llm.model": "us.amazon.nova-2-lite-v1:0", "classification.split_then_classify.section_classification.llm.model": "us.amazon.nova-2-lite-v1:0"}, {"classification.strategy": "combined", "classification.combined.granularity": "packet", "classification.combined.llm.model": "us.amazon.nova-2-lite-v1:0", "classification.split_then_classify.splitting.llm.model": "us.amazon.nova-2-lite-v1:0", "classification.split_then_classify.section_classification.llm.model": "us.amazon.nova-2-lite-v1:0"}, {"classification.strategy": "split_then_classify", "classification.split_then_classify.splitting.llm.granularity": "page", "classification.combined.llm.model": "us.amazon.nova-2-lite-v1:0", "classification.split_then_classify.splitting.llm.model": "us.amazon.nova-2-lite-v1:0", "classification.split_then_classify.section_classification.llm.model": "us.amazon.nova-2-lite-v1:0"}, {"classification.strategy": "split_then_classify", "classification.split_then_classify.splitting.llm.granularity": "packet", "classification.combined.llm.model": "us.amazon.nova-2-lite-v1:0", "classification.split_then_classify.splitting.llm.model": "us.amazon.nova-2-lite-v1:0", "classification.split_then_classify.section_classification.llm.model": "us.amazon.nova-2-lite-v1:0"}, {"classification.strategy": "combined", "classification.combined.granularity": "page", "classification.combined.llm.model": "us.anthropic.claude-haiku-5-5", "classification.split_then_classify.splitting.llm.model": "us.anthropic.claude-haiku-5-5", "classification.split_then_classify.section_classification.llm.model": "us.anthropic.claude-haiku-5-5"}, {"classification.strategy": "combined", "classification.combined.granularity": "packet", "classification.combined.llm.model": "us.anthropic.claude-haiku-5-5", "classification.split_then_classify.splitting.llm.model": "us.anthropic.claude-haiku-5-5", "classification.split_then_classify.section_classification.llm.model": "us.anthropic.claude-haiku-5-5"}, {"classification.strategy": "split_then_classify", "classification.split_then_classify.splitting.llm.granularity": "page", "classification.combined.llm.model": "us.anthropic.claude-haiku-5-5", "classification.split_then_classify.splitting.llm.model": "us.anthropic.claude-haiku-5-5", "classification.split_then_classify.section_classification.llm.model": "us.anthropic.claude-haiku-5-5"}, {"classification.strategy": "split_then_classify", "classification.split_then_classify.splitting.llm.granularity": "packet", "classification.combined.llm.model": "us.anthropic.claude-haiku-5-5", "classification.split_then_classify.splitting.llm.model": "us.anthropic.claude-haiku-5-5", "classification.split_then_classify.section_classification.llm.model": "us.anthropic.claude-haiku-5-5"}, {"classification.strategy": "combined", "classification.combined.granularity": "page", "classification.combined.llm.model": "us.anthropic.claude-sonnet-5", "classification.split_then_classify.splitting.llm.model": "us.anthropic.claude-sonnet-5", "classification.split_then_classify.section_classification.llm.model": "us.anthropic.claude-sonnet-5"}, {"classification.strategy": "combined", "classification.combined.granularity": "packet", "classification.combined.llm.model": "us.anthropic.claude-sonnet-5", "classification.split_then_classify.splitting.llm.model": "us.anthropic.claude-sonnet-5", "classification.split_then_classify.section_classification.llm.model": "us.anthropic.claude-sonnet-5"}, {"classification.strategy": "split_then_classify", "classification.split_then_classify.splitting.llm.granularity": "page", "classification.combined.llm.model": "us.anthropic.claude-sonnet-5", "classification.split_then_classify.splitting.llm.model": "us.anthropic.claude-sonnet-5", "classification.split_then_classify.section_classification.llm.model": "us.anthropic.claude-sonnet-5"}, {"classification.strategy": "split_then_classify", "classification.split_then_classify.splitting.llm.granularity": "packet", "classification.combined.llm.model": "us.anthropic.claude-sonnet-5", "classification.split_then_classify.splitting.llm.model": "us.anthropic.claude-sonnet-5", "classification.split_then_classify.section_classification.llm.model": "us.anthropic.claude-sonnet-5"}]
    grid: {rows: ["Page by page", "Holistic", "Detect sections first, page by page", "Detect sections first, holistic"], cols: ["Amazon Nova 2 Lite (default)", "Claude Haiku 5.5", "Claude Sonnet 5"]}
    datasets: [docsplit]
    runs: 3
    metrics: [page_accuracy, section_accuracy, grouping_score, classification_tokens, total_tokens]
    plot: section_accuracy
  - id: SC-02
    page: splitting-and-classification
    question: "Do I need page images in the classification prompt?"
    changes: "What the classification model reads"
    values: ["Text and images (default)", "Text only", "Images only"]
    set: [{"classification.combined.llm.modality": {"text": true, "images": true}}, {"classification.combined.llm.modality": {"text": true, "images": false}}, {"classification.combined.llm.modality": {"text": false, "images": true}}]
    holds: "Page-by-page granularity"
    datasets: [docsplit]
    runs: 3
    metrics: [page_accuracy, boundary_accuracy, label_accuracy, classification_tokens]
  - id: SC-03
    page: splitting-and-classification
    question: "Which classification model should I use?"
    changes: "Classification model"
    values: ["Amazon Nova 2 Lite (default)", "Amazon Nova Pro", "Claude Haiku 5.5", "Claude Sonnet 5"]
    set: [{"classification.combined.llm.model": "us.amazon.nova-2-lite-v1:0", "classification.split_then_classify.splitting.llm.model": "us.amazon.nova-2-lite-v1:0", "classification.split_then_classify.section_classification.llm.model": "us.amazon.nova-2-lite-v1:0"}, {"classification.combined.llm.model": "us.amazon.nova-pro-v1:0", "classification.split_then_classify.splitting.llm.model": "us.amazon.nova-pro-v1:0", "classification.split_then_classify.section_classification.llm.model": "us.amazon.nova-pro-v1:0"}, {"classification.combined.llm.model": "us.anthropic.claude-haiku-5-5", "classification.split_then_classify.splitting.llm.model": "us.anthropic.claude-haiku-5-5", "classification.split_then_classify.section_classification.llm.model": "us.anthropic.claude-haiku-5-5"}, {"classification.combined.llm.model": "us.anthropic.claude-sonnet-5", "classification.split_then_classify.splitting.llm.model": "us.anthropic.claude-sonnet-5", "classification.split_then_classify.section_classification.llm.model": "us.anthropic.claude-sonnet-5"}]
    holds: "Run at both granularities: page by page and holistic"
    datasets: [docsplit]
    runs: 3
    metrics: [page_accuracy, section_accuracy, grouping_score, boundary_accuracy, label_accuracy, classification_tokens, total_tokens, median_seconds]
    plot: section_accuracy
  - id: SC-04
    page: splitting-and-classification
    question: "How long a packet can holistic classification handle?"
    changes: "Pages per holistic call (`window_pages`)"
    values: ["20 (default)", "10", "40"]
    holds: "Holistic, one call"
    datasets: [long_packets, docsplit]
    runs: 3
    metrics: [page_accuracy, boundary_accuracy, label_accuracy, classification_tokens]
  - id: SC-05
    page: splitting-and-classification
    question: "Does neighboring-page context help page-by-page classification?"
    changes: "`contextPagesCount`"
    values: ["0 (default)", "1", "2"]
    set: [{"classification.combined.page.contextPagesCount": 0}, {"classification.combined.page.contextPagesCount": 1}, {"classification.combined.page.contextPagesCount": 2}]
    datasets: [docsplit, same_class_packets]
    runs: 3
    metrics: [boundary_accuracy, label_accuracy, over_splits, merges, classification_tokens]
  - id: SC-06
    page: splitting-and-classification
    question: "Do few-shot examples help classification?"
    changes: "Few-shot examples"
    values: ["None (default)", "One example per class", "Two examples per class"]
    datasets: [docsplit]
    runs: 3
    metrics: [page_accuracy, label_accuracy, classification_tokens]
  - id: SC-07
    page: splitting-and-classification
    question: "How much do class descriptions matter?"
    changes: "Class descriptions"
    values: ["Class names only", "Generic descriptions", "Descriptions that name distinguishing features"]
    datasets: [docsplit]
    runs: 3
    metrics: [page_accuracy, label_accuracy]
  - id: SC-08
    page: splitting-and-classification
    question: "Does accuracy drop as I add document classes?"
    changes: "Number of document classes in the configuration"
    values: ["5", "13", "30 (13 plus 17 distractor classes)"]
    datasets: [docsplit]
    runs: 3
    metrics: [page_accuracy, label_accuracy, classification_tokens]
  - id: SC-09
    page: splitting-and-classification
    question: "How small can classification images be?"
    changes: "Classification image size (long edge)"
    values: ["As rendered (default)", "1,024 pixels", "512 pixels"]
    datasets: [docsplit]
    runs: 3
    metrics: [page_accuracy, boundary_accuracy, classification_tokens]
  - id: SC-10
    page: splitting-and-classification
    question: "If every file is one document, should I turn splitting off?"
    changes: "Section splitting"
    values: ["Model decides (default)", "One section"]
    datasets: [realkie, synth_400, synth_800]
    runs: 3
    metrics: [weighted_accuracy, completeness, classification_tokens]

  # ------------------------------------------------------------------- extraction
  - id: EX-01
    page: extraction
    question: "When is agentic (iterative) extraction worth it?"
    changes: "Extraction mode"
    values: ["Single pass, Simple (default)", "Iterative, Advanced"]
    set: [{"extraction.mode": "simple"}, {"extraction.mode": "advanced"}]
    datasets: [synth_100, synth_400, synth_800, synth_1600, synth_3200, realkie, realkie_short, realkie_long, fake_w2]
    runs: 3
    metrics: [completeness, cell_accuracy, weighted_accuracy, extraction_tokens, total_tokens, median_seconds]
  - id: EX-02
    page: extraction
