  .axislabel { font-size: 11px; fill: var(--ink-2); }
  .note { font-size: 11px; fill: var(--muted); font-style: italic; }
  .num { font-size: 11px; font-weight: 700; fill: var(--ink); }
  .halo { paint-order: stroke; stroke: var(--ring); stroke-width: 3px;
