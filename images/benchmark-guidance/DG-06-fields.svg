<svg xmlns="http://www.w3.org/2000/svg" class="viz" width="720" height="786" viewBox="0 0 720 786" role="img"><title>Weighted accuracy against Cost per 1,000 documents (USD), mean of 3 runs with two standard errors either side</title><desc>RealKIE: TABLES, LAYOUT, SIGNATURES (default) 0.8 at $136, LAYOUT only 0.79 at $86.6, TABLES only 0.81 at $138, TABLES, LAYOUT, SIGNATURES, FORMS 0.79 at $339; Fake-W2: TABLES, LAYOUT, SIGNATURES (default) 0.95 at $32.7, LAYOUT only 0.96 at $20.3, TABLES only 0.97 at $32.2, TABLES, LAYOUT, SIGNATURES, FORMS 0.97 at $82.2; RealKIE, marginal cost of error against LAYOUT only: TABLES, LAYOUT, SIGNATURES (default) no measurable gain, TABLES only no measurable gain, TABLES, LAYOUT, SIGNATURES, FORMS no measurable gain; Fake-W2, marginal cost of error against LAYOUT only: TABLES only no measurable gain, TABLES, LAYOUT, SIGNATURES, FORMS no measurable gain</desc><style>
