<svg xmlns="http://www.w3.org/2000/svg" class="viz" width="720" height="327" viewBox="0 0 720 327" role="img"><title>Page accuracy against Cost per 1,000 documents (USD), mean of 3 runs with two standard errors either side</title><desc>DocSplit: Text and images (default) 0.82 at $498, Text only 0.79 at $499, Images only 0.84 at $484</desc><style>
