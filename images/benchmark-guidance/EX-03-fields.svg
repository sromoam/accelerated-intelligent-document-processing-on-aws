<svg xmlns="http://www.w3.org/2000/svg" class="viz" width="720" height="694" viewBox="0 0 720 694" role="img"><title>Weighted accuracy against Cost per 1,000 documents (USD), mean of 3 runs with two standard errors either side</title><desc>RealKIE: Low (default) 0.79 at $136, Medium 0.81 at $141, High 0.83 at $151; Fake-W2: Low (default) 0.95 at $32.6, Medium 0.97 at $35.4, High 0.97 at $40.1; RealKIE, marginal cost of error against Low (default): Medium no measurable gain, High no measurable gain; Fake-W2, marginal cost of error against Low (default): Medium no measurable gain, High no measurable gain</desc><style>
  .viz { --series: #2a78d6; --ring: #ffffff; --ink: #0b0b0b; --ink-2: #52514e;
         --muted: #898781; --grid: #e1e0d9; --axis: #c3c2b7; }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) .viz, svg.viz:root { --series: #3987e5;
      --ring: #17181c; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
      --grid: #2c2c2a; --axis: #383835; }
  }
