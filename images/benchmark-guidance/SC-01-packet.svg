<svg xmlns="http://www.w3.org/2000/svg" class="viz" width="720" height="388" viewBox="0 0 720 388" role="img"><title>Section accuracy against Cost per 1,000 documents (USD), mean of 3 runs with two standard errors either side</title><desc>DocSplit: Page by page, one call (default) 0.52 at $493, Holistic, one call 0.55 at $454, Detect sections first (page by page), then classify 0.65 at $483, Detect sections first (holistic), then classify 0.55 at $460; DocSplit, marginal cost of error against Holistic, one call: Detect sections first (page by page), then classify $0.28 per error</desc><style>
  .viz { --series: #2a78d6; --ring: #ffffff; --ink: #0b0b0b; --ink-2: #52514e;
         --muted: #898781; --grid: #e1e0d9; --axis: #c3c2b7; }
  @media (prefers-color-scheme: dark) {
