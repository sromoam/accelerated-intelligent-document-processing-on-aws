<svg xmlns="http://www.w3.org/2000/svg" class="viz" width="720" height="388" viewBox="0 0 720 388" role="img"><title>Section accuracy against Total tokens per page, mean of 3 runs with two standard errors either side</title><desc>DocSplit: Amazon Nova 2 Lite (default) 0.51 at 14,865, Amazon Nova Pro 0.48 at 16,630, Claude Haiku 5.5 0.71 at 20,667, Claude Sonnet 5 0.71 at 20,274</desc><style>
