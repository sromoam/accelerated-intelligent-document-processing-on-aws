<svg xmlns="http://www.w3.org/2000/svg" class="viz" width="720" height="768" viewBox="0 0 720 768" role="img"><title>Weighted accuracy against Cost per 1,000 documents (USD), mean of 3 runs with two standard errors either side</title><desc>RealKIE: Textract, tables and layout (default) 0.81 at $135, Textract, layout only 0.8 at $94.2, Bedrock vision model (Nova 2 Lite) 0.81 at $107; OmniAI, bank checks: Textract, tables and layout (default) 0.94 at $17.5, Textract, layout only 0.94 at $6.46, Bedrock vision model (Nova 2 Lite) 0.9 at $3.74; RealKIE, marginal cost of error against Textract, layout only: Textract, tables and layout (default) no measurable gain, Bedrock vision model (Nova 2 Lite) no measurable gain; OmniAI, bank checks, marginal cost of error against Bedrock vision model (Nova 2 Lite): Textract, tables and layout (default) no measurable gain, Textract, layout only no measurable gain</desc><style>
