<svg xmlns="http://www.w3.org/2000/svg" class="viz" width="720" height="754" viewBox="0 0 720 754" role="img"><title>Weighted accuracy against Total tokens per page, mean of 3 runs with two standard errors either side</title><desc>RealKIE: Textract, tables and layout (default) 0.81 at 19,629, Textract, layout only 0.8 at 19,810, Bedrock vision model (Nova 2 Lite) 0.81 at 16,382; OmniAI, bank checks: Textract, tables and layout (default) 0.94 at 9,613, Textract, layout only 0.94 at 9,225, Bedrock vision model (Nova 2 Lite) 0.9 at 9,710</desc><style>
