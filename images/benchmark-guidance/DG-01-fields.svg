<svg xmlns="http://www.w3.org/2000/svg" class="viz" width="720" height="754" viewBox="0 0 720 754" role="img"><title>Weighted accuracy against Cost per 1,000 documents (USD), mean of 3 runs with two standard errors either side</title><desc>RealKIE: Textract, tables and layout (default) 0.81 at $135, Textract, layout only 0.8 at $89.3, Bedrock vision model (Nova 2 Lite) 0.81 at $101; OmniAI, bank checks: Textract, tables and layout (default) 0.94 at $17.6, Textract, layout only 0.94 at $6.46, Bedrock vision model (Nova 2 Lite) 0.9 at $3.66; RealKIE, marginal cost of error against Textract, layout only: Textract, tables and layout (default) no measurable gain, Bedrock vision model (Nova 2 Lite) no measurable gain; OmniAI, bank checks, marginal cost of error against Bedrock vision model (Nova 2 Lite): Textract, tables and layout (default) no measurable gain, Textract, layout only no measurable gain</desc><style>
  .viz { --series: #2a78d6; --ring: #ffffff; --ink: #0b0b0b; --ink-2: #52514e;
         --muted: #898781; --grid: #e1e0d9; --axis: #c3c2b7; }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) .viz, svg.viz:root { --series: #3987e5;
      --ring: #17181c; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
      --grid: #2c2c2a; --axis: #383835; }
  }
