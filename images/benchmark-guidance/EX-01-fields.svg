<svg xmlns="http://www.w3.org/2000/svg" class="viz" width="720" height="312" viewBox="0 0 720 312" role="img"><title>Weighted accuracy against Total tokens per page, mean of 3 runs with two standard errors either side</title><desc>RealKIE: Single pass, Simple (default) 0.8 at 20,208, Iterative, Advanced 0.8 at 20,843</desc><style>
